<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#526b5c"><meta name="description" content="十二维灵感日历，每天一份值得收藏的私人杂志"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>十二维 · 灵感日历</title><style>:root{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#263b34;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}header{background:#e8ede6;padding:28px max(20px,calc((100vw - 900px)/2));border-bottom:1px solid #d8dfd5}h1{font-family:Georgia,'Noto Serif SC',serif;font-size:32px;margin:6px 0}main{max-width:900px;margin:auto;padding:20px}.muted{color:#6b796e;font-size:13px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #c6d0c7;background:#fff;border-radius:9px;padding:9px 12px;color:#27483b}button:hover{background:#e7efe8}.primary{background:#395c4a;color:white}.primary:hover{background:#294a39}nav,.actions{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:white;padding:20px;border:1px solid #e3e7df;border-radius:16px;margin:16px 0}.days,.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week{text-align:center;color:#7c897f;margin:15px 0 8px}.day{min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}.day:disabled{opacity:.25;cursor:default}.day.has{background:#e8f0e9;border-color:#a8bfaf}.day.active{outline:2px solid #47735a}.dot{width:6px;height:6px;background:#547b60;border-radius:50%}.article{border-bottom:1px solid #edf0ea;padding:14px 0}.article:last-child{border-bottom:0}.article h3{margin:4px 0}.article p{white-space:pre-wrap;line-height:1.85}#search{width:100%;padding:12px;border-radius:9px;border:1px solid #cbd3c8}textarea{width:100%;min-height:130px;padding:12px;border:1px solid #cbd3c8;border-radius:9px}label{font-size:13px;font-weight:600;display:block;margin:10px 0 6px}#status{font-size:13px;color:#5b7063}footer{font-size:12px;color:#78857a;text-align:center;padding:24px}a{color:#35684d}@media(max-width:560px){.day{min-height:52px;padding:7px;font-size:13px}.panel{padding:13px}h1{font-size:26px}}</style></head><body><header><div class="muted">私人知识杂志 · 每日十二个不同角度</div><h1>十二维 · 灵感日历</h1><div class="muted">把好奇心，留在日历里。</div></header><main><div class="panel"><nav><button id="prev">‹ 上个月</button><strong id="month"></strong><button id="next">下个月 ›</button></nav><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days" id="days"></div></div><div class="panel"><div class="actions"><h2 id="selectedTitle">选择一天</h2><button id="editorToggle">＋ 添加/编辑文章</button></div><input id="search" placeholder="搜索当期文章内容或标题"><div id="articles"></div></div><div class="panel" id="editor" hidden><h2>编辑当期内容</h2><p class="muted">一行标题 + 正文：每栏独立编辑。保存内容仅存在当前浏览器；发布给其他设备需把数据导出并上传到仓库。</p><label>日期</label><input type="date" id="date"><label>期刊标题</label><input id="issueTitle" placeholder="例如：VOL.004｜周日的灵感"><label>12栏内容（使用 JSON 格式；可从示例修改）</label><textarea id="jsonText" rows="12"></textarea><div class="actions"><button class="primary" id="save">保存到本机</button><button id="export">导出全部文章 JSON</button><label style="margin:0">导入JSON <input type="file" id="import" accept="application/json,.json"></label></div><p id="status"></p></div><div class="panel"><h2>使用说明</h2><p>日历绿色圆点表示已经有文章的日期。这个初版预置了前三期的目录摘要，不是完整原文；可通过编辑器补充文章。数据只在当前浏览器保存，不会自动同步到 GitHub 或其他手机。</p><p>想让每日推送自动出现在不同设备上，需要下一阶段搭建自动更新文章数据的流程。</p></div></main><footer>十二维 · 灵感日历 / 原型版 v1.0</footer><script>
const columns=['世界级设计案例','颠覆认知的知识','实用小工具','私人历史博物馆','AI与开源工具','高级配色与材质','思维挑战','电影与纪录片','特色植物研究','哲学辩论','普通物品重新设计','世界情报'];const seeds={
'2026-11-19':{title:'VOL.001｜城市里的文化博物馆',items:['哥本哈根 Superkilen 公园','姆潘巴效应：为什么热水有时先结冰','景观铺装估算器','莱库古斯杯：古罗马变色玻璃','QGIS 开源GIS','雾蓝、石灰与陶土橙','三门问题','电影《帕特森》','水杉','艺术一定需要作者吗','会呼吸的公共垃圾桶','当天科技与产业新闻']},
'2026-11-20':{title:'VOL.002｜废墟的新生',items:['杜伊斯堡北部景观公园','GPS 为什么需要相对论','树池土方估算器','安提基特拉机械','BlenderGIS','工业锈红与冷雾灰','100名囚犯与灯泡','电影《哥伦布》','落羽杉','AI可能拥有意识吗','公共雨水花箱','当天科技与产业新闻']},
'2026-11-21':{title:'VOL.003｜重新连接城市与河流',items:['马德里河公园 Madrid Río','河流为什么自己弯曲','雨水花园调蓄估算器','敦煌星图','WebODM 摄影测量','雨后青苔与浅灰陶土','三个盒子的水果推理','电影《完美的日子》','流苏树','城市自然应该管理到何种程度','可维修公共座椅','当天科技与产业新闻']}};
let all={};try{all=JSON.parse(localStorage.getItem('twelve-inspirations')||'{}')}catch(e){}for(const [k,v] of Object.entries(seeds))if(!all[k])all[k]={title:v.title,items:v.items.map((x,i)=>({title:columns[i]+'｜'+x,body:'本期目录摘要。完整正文请从原始每日合集补入。'}))};let now=new Date(2026,10,21),year=now.getFullYear(),month=now.getMonth(),selected='2026-11-21';const $=x=>document.getElementById(x);const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;function render(){ $('month').textContent=`${year}年${month+1}月`;const el=$('days');el.innerHTML='';const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++){const b=document.createElement('button');b.className='day';b.disabled=true;el.append(b)}let max=new Date(year,month+1,0).getDate();for(let d=1;d<=max;d++){let k=key(year,month,d),b=document.createElement('button');b.className='day'+(all[k]?' has':'')+(selected===k?' active':'');let num=document.createElement('span');num.textContent=d;b.append(num);if(all[k]){let dot=document.createElement('span');dot.className='dot';b.append(dot)}b.onclick=()=>{selected=k;render()};el.append(b)}$('selectedTitle').textContent=selected+' · '+(all[selected]?.title||'暂无文章');$('date').value=selected;$('issueTitle').value=all[selected]?.title||'';$('jsonText').value=JSON.stringify(all[selected]?.items||columns.map(x=>({title:x,body:''})),null,2);filter()}
function filter(){let q=$('search').value.trim().toLowerCase(),dest=$('articles');dest.innerHTML='';let list=all[selected]?.items||[];list.filter(x=>(x.title+x.body).toLowerCase().includes(q)).forEach((x,i)=>{let a=document.createElement('div');a.className='article';let h=document.createElement('h3');h.textContent=x.title;let p=document.createElement('p');p.textContent=x.body;a.append(h,p);dest.append(a)});if(!dest.children.length)dest.textContent=all[selected]?'没有匹配栏目':'这一天还没有文章。点击「添加/编辑文章」可以新建。'}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('search').oninput=filter;$('editorToggle').onclick=()=>{$('editor').hidden=!$('editor').hidden};$('save').onclick=()=>{try{let dt=$('date').value,items=JSON.parse($('jsonText').value);if(!/^\d{4}-\d\d-\d\d$/.test(dt)||!Array.isArray(items)||items.some(x=>typeof x.title!=='string'||typeof x.body!=='string'))throw Error('日期或栏目格式不正确');all[dt]={title:$('issueTitle').value,items};localStorage.setItem('twelve-inspirations',JSON.stringify(all));selected=dt;let ds=dt.split('-').map(Number);year=ds[0];month=ds[1]-1;$('status').textContent='已保存到当前浏览器';render()}catch(e){$('status').textContent='保存失败：'+e.message}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='twelve-articles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let t=await e.target.files[0].text(),data=JSON.parse(t);if(!data||Array.isArray(data)||typeof data!=='object')throw Error('文件格式不正确');for(let [k,v] of Object.entries(data)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(v.items)||v.items.some(x=>typeof x.title!=='string'||typeof x.body!=='string'))throw Error('文章结构错误')}all={...all,...data};localStorage.setItem('twelve-inspirations',JSON.stringify(all));render();$('status').textContent='导入完成'}catch(err){$('status').textContent='导入失败：'+err.message}};render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
